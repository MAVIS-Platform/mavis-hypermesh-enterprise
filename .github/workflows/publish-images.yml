name: Publish HyperMesh Enterprise Images

on:
  push:
    branches: [main]
    paths-ignore:
      - "docker-compose.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push all 10 microservices
        run: |
          set -euo pipefail
          : > digests.env
          for service in api-gateway auth-service catalog-service pricing-service cart-service order-service inventory-service payment-service fraud-service notification-worker; do
            image="ghcr.io/mavis-platform/mavis-hypermesh-enterprise-${service}:${GITHUB_SHA}"
            latest="ghcr.io/mavis-platform/mavis-hypermesh-enterprise-${service}:latest"
            docker buildx build --platform linux/amd64 --push \
              --file "./${service}/Dockerfile" \
              --tag "$image" --tag "$latest" .
            digest="$(docker buildx imagetools inspect "$image" --format '{{json .Manifest.Digest}}' | tr -d '"')"
            echo "${service}=${digest}" >> digests.env
          done
          cat digests.env

      - name: Pin immutable digests in docker-compose.yml
        run: |
          python3 - <<'PY'
          from pathlib import Path
          digests = dict(line.split("=", 1) for line in Path("digests.env").read_text().splitlines() if "=" in line)
          compose = Path("docker-compose.template.yml").read_text()
          for svc, digest in digests.items():
              placeholder = "__" + svc.upper().replace("-", "_") + "_IMAGE__"
              compose = compose.replace(placeholder, f"ghcr.io/mavis-platform/mavis-hypermesh-enterprise-{svc}@{digest}")
          Path("docker-compose.yml").write_text(compose)
          PY

      - name: Commit digest-pinned docker-compose.yml
        run: |
          git config user.name "mavis-bot"
          git config user.email "mavis-bot@users.noreply.github.com"
          git add docker-compose.yml
          if git diff --cached --quiet; then
            echo "docker-compose.yml already up to date"
          else
            git commit -m "chore(images): pin HyperMesh Enterprise digests for ${GITHUB_SHA} [skip ci]"
            git push
          fi
